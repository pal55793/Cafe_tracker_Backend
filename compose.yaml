
services:
  mongodb:
    image: mongo:8
    container_name: task-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    container_name: task-api
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SPRING_MONGODB_URI: mongodb://mongodb:27017/cafe_tracker
    depends_on:
      - mongodb

volumes:
  mongo_data:
